name: PHP Composer

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: testpassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, pdo_sqlite, mbstring, curl, dom, xml, xmlreader, xmlwriter, simplexml, gd, zip
          coverage: none
          tools: composer

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Install MariaDB client
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client

      - name: Create runtime directories
        run: mkdir -p public/uploads tmp

      - name: Create test configuration
        run: |
          cat > config/dbconfig.ini <<'EOF'
          dbhost=127.0.0.1
          dbuser=root
          dbpass=testpassword
          dbname=chandra_ci_test
          EOF

          cat > tests/testweb.ini <<'EOF'
          base_url="http://127.0.0.1:8000/public"
          EOF

      - name: Initialize test database
        env:
          MYSQL_PWD: testpassword
        run: |
          sed 's/\bnoblestock\b/chandra_ci_test/g' doc/create_db_tables.sql \
            | mariadb --host=127.0.0.1 --user=root

      - name: Start test web server
        run: |
          php -S 127.0.0.1:8000 -t . > /tmp/noblestock-php.log 2>&1 &
          echo "$!" > /tmp/noblestock-php.pid

          for i in {1..30}; do
            if curl --silent --fail \
              http://127.0.0.1:8000/public/index.php > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/noblestock-php.log
          exit 1

      - name: Run PHPUnit
        env:
          MYSQL_BIN: /usr/bin/mariadb
          MYSQLDUMP_BIN: /usr/bin/mariadb-dump
        run: vendor/bin/phpunit

      - name: Show web server log on failure
        if: failure()
        run: |
          if [ -f /tmp/noblestock-php.log ]; then
            cat /tmp/noblestock-php.log
          fi

      - name: Stop test web server
        if: always()
        run: |
          if [ -f /tmp/noblestock-php.pid ]; then
            kill "$(cat /tmp/noblestock-php.pid)" 2>/dev/null || true
          fi
