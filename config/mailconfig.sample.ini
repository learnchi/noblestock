; SMTP設定
; mailconfig.ini としてコピーして、環境ごとの値を設定してください。
; CHANDRA_MAIL_SOURCE=env を設定した場合は、このファイルではなく
; MAIL_SMTP_HOST / MAIL_SMTP_PORT / MAIL_SMTP_AUTH / MAIL_SMTP_USER /
; MAIL_SMTP_PASS / MAIL_SMTP_SECURE / MAIL_FROM を参照します。
smtp_host=smtp.example.com
smtp_port=587
smtp_auth=true
smtp_user=NobleStock-system
smtp_pass=smtppassword
smtp_secure=tls
mail_from=admin@example.com
